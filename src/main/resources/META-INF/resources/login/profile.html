   <!--기존로그인등페이지의디자인을재활용한다.-->
<section class="hero d-flex align-items-center
justify-content-center text-center py-5">
<div class="container" style="max-width: 500px;">
<h2 class="fw-bold mb-4">내프로필</h2>
<!--프로필사진영역-->
<div class="mb-4">
<imgid="profileImg"
src="/uploads/profile/default.jpg"
class="rounded-circle"
width="120" height="120"
style="object-fit:cover; border:3px solid #fff;"
alt="프로필사진">
</div>
<!--개인정보출력-->
<div class="card bg-dark text-white border-secondary mb-4">
<div class="card-body text-start">
<table class="table table-dark table-bordered mb-0">
<tr>
    <thstyle="width:30%">아이디</th>
<td id="infoUsername"></td>
</tr>
<tr>
<th>이메일</th>
<td id="infoEmail"></td>
</tr>
<tr>
<th>연락처</th>
<td id="infoPhone"></td>
</tr>
</table>
</div>
</div>
<!--사진업로드폼-->
<form id="uploadForm"
method="POST"
action="/profile/upload"
enctype="multipart/form-data">
<div class="mb-3">
<label class="form-label">프로필사진변경</label>
<input type="file"
class="form-control"
id="profileFile"
name="profileImage"
accept="image/jpeg,image/png,image/gif,image/webp">
<div class="form-text text-muted">
jpg, png, gif, webp/ 최대5MB
</div>
</div>
<button type="submit"
class="btnbtn-primary w-100">
사진업로드
</button>
</form>
</div>
</section>

   <!--모달(iframe으로Aatrox.html 불러오기) -->
<div class="modal fade" id="modalAatrox" tabindex="-1" aria-labelledby="modalAatroxLabel" aria-hidden="true">
<div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
<div class="modal-content bg-dark text-white border-secondary">
<!--헤더-->
<div class="modal-header border-secondary">
<h5 class="modal-title" id="modalAatroxLabel">아트록스(Aatrox) 상세정보</h5>
<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>


<!--바디: iframe으로내용채움-->
<div class="modal-body p-0" style="height: 65vh; background: #0a0e17;">
<iframe
src="“../modals/Aatrox.html"
frameborder="0"
style="width: 100%; height: 100%; border: none;"
allowfullscreen>
</iframe>
</div>

<!--푸터-->
<div class="modal-footer border-secondary">
<button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">닫기</button>
</div>
</div>
</div>
</div>
